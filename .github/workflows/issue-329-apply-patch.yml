name: Issue 329 Branch Patch

on:
  push:
    branches:
      - controller/issue-329-air-reset-promo-engine
    paths:
      - .github/issue329.patch

permissions:
  contents: write

concurrency:
  group: issue-329-branch-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: controller/issue-329-air-reset-promo-engine
          fetch-depth: 0
      - name: Apply controller-reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/issue329.patch ]; then
            echo "No patch file present; nothing to do."
            exit 0
          fi
          git config user.name "CWF Controller"
          git config user.email "controller@users.noreply.github.com"
          git apply --index .github/issue329.patch
          git rm .github/issue329.patch
          git diff --cached --check
          git commit -m "[Controller] Issue #329: apply targeted correction patch"
          git push origin HEAD:controller/issue-329-air-reset-promo-engine
