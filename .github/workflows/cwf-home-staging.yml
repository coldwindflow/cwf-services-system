name: CWF Home Staging

on:
  push:
    branches:
      - staging/home-server-test
  workflow_dispatch:
    inputs:
      action:
        description: Operation to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - restart
          - rollback
          - status

permissions:
  contents: read

env:
  GIT_CONFIG_NOSYSTEM: "1"

concurrency:
  group: cwf-home-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Staging operation
    runs-on:
      - self-hosted
      - linux
      - x64
      - cwf-home
    timeout-minutes: 60
    steps:
      - name: Check out merged staging revision
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Apply guarded PREPAID lifecycle migration
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          # The new SHA is not deployed yet; revision verification belongs to the post-deploy seed gate.
          bash scripts/apply-prepaid-service-entitlements-home.sh staging | tee /tmp/cwf-staging-prepaid-migration.log
          cat /tmp/cwf-staging-prepaid-migration.log >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect Partner retirement safety (read-only)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/bin/docker exec cwf-staging-app node -e '
            const pool = require("./db");
            (async () => {
              const tables = await pool.query("SELECT table_schema, table_name, column_name FROM information_schema.columns WHERE table_name ILIKE $1 ORDER BY table_schema, table_name, ordinal_position", ["%migrat%"]);
              const overrides = await pool.query("SELECT count(*)::int AS touched FROM public.partner_applications WHERE admin_job_override_enabled OR admin_job_override_by IS NOT NULL OR admin_job_override_at IS NOT NULL OR admin_job_override_note IS NOT NULL");
              const events = await pool.query("SELECT count(*)::int AS override_events FROM public.partner_onboarding_events WHERE event_type LIKE $1", ["admin_job_override_%"]);
              console.log("[PARTNER_RETIRE_INSPECT] migration_columns=" + JSON.stringify(tables.rows));
              console.log("[PARTNER_RETIRE_INSPECT] touched_applications=" + overrides.rows[0].touched + " override_events=" + events.rows[0].override_events);
            })().catch(error => { console.error("[PARTNER_RETIRE_INSPECT] " + error.message); process.exitCode = 1; }).finally(() => pool.end());
          '

      - name: Auto deploy merged commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/cwf-deployctl staging deploy "$GITHUB_SHA" | tee /tmp/cwf-staging-action.log
          cat /tmp/cwf-staging-action.log >> "$GITHUB_STEP_SUMMARY"

      - name: Manual operation
        if: github.event_name == 'workflow_dispatch'
        env:
          CWF_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$CWF_ACTION" in
            deploy)
              sudo -n /usr/local/sbin/cwf-deployctl staging deploy | tee /tmp/cwf-staging-action.log
              ;;
            restart)
              sudo -n /usr/local/sbin/cwf-deployctl staging restart | tee /tmp/cwf-staging-action.log
              ;;
            rollback)
              sudo -n /usr/local/sbin/cwf-deployctl staging rollback | tee /tmp/cwf-staging-action.log
              ;;
            status)
              sudo -n /usr/local/sbin/cwf-deployctl staging status | tee /tmp/cwf-staging-action.log
              ;;
            *)
              echo "Unsupported action: $CWF_ACTION" >&2
              exit 2
              ;;
          esac
          cat /tmp/cwf-staging-action.log >> "$GITHUB_STEP_SUMMARY"
