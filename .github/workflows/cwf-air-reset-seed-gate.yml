name: CWF Promotion Seed Gate

on:
  workflow_run:
    workflows:
      - CWF Home Staging
      - CWF Home Production
    types:
      - completed

permissions:
  contents: read

env:
  GIT_CONFIG_NOSYSTEM: "1"

concurrency:
  group: cwf-promotion-seed-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  seed-staging:
    name: Verify and seed active promotion on staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging/home-server-test'
    runs-on:
      - self-hosted
      - linux
      - x64
      - cwf-home
    timeout-minutes: 15
    steps:
      - name: Check out deployed staging revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Apply prepaid schema and guarded CWF AIR CARE seed
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          bash scripts/apply-prepaid-service-entitlements-home.sh staging | tee /tmp/cwf-prepaid-migration.log
          bash scripts/apply-cwf-air-care-seed.sh staging | tee /tmp/cwf-promotion-seed.log
          cat /tmp/cwf-prepaid-migration.log >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cwf-promotion-seed.log >> "$GITHUB_STEP_SUMMARY"

      - name: Provision designated staging QA identity
        shell: bash
        env:
          CWF_STAGING_QA_SECRET: ${{ secrets.CWF_STAGING_QA_SECRET }}
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          bash scripts/run-staging-air-care-qa.sh staging provision | tee /tmp/cwf-staging-qa-provision.log
          grep '^\[QA_EVIDENCE\]' /tmp/cwf-staging-qa-provision.log >> "$GITHUB_STEP_SUMMARY"

  seed-production:
    name: Verify and seed active promotion on production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'production/home-server'
    runs-on:
      - self-hosted
      - linux
      - x64
      - cwf-home
    timeout-minutes: 15
    steps:
      - name: Check out deployed production revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Apply prepaid schema and guarded CWF AIR CARE seed
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          bash scripts/apply-prepaid-service-entitlements-home.sh production | tee /tmp/cwf-prepaid-migration.log
          bash scripts/apply-cwf-air-care-seed.sh production | tee /tmp/cwf-promotion-seed.log
          cat /tmp/cwf-prepaid-migration.log >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cwf-promotion-seed.log >> "$GITHUB_STEP_SUMMARY"
