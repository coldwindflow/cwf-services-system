name: CWF CI Tests

# Issue 320: nothing ran the test suite automatically.
#
# `main` is a protected branch that requires a pull request, and the release
# promotion workflow opens a main -> staging promotion PR on every push to main.
# So the path from a merge to production was fully automated while the 1600+
# tests that guard booking, pricing, availability, package minimums, the Thai
# Admin UI and the cross-app contracts only ever ran on a developer's machine.
#
# This workflow closes that gap. It is deliberately boring: install exactly what
# package-lock.json pins, syntax-check every changed script, and run the suite.
# It never touches a database, a deploy target, or Production.

on:
  pull_request:
    branches:
      - main
      - staging/home-server-test
      - production/home-server
  push:
    branches:
      - main

# Read-only: this workflow must never be able to change the repository.
permissions:
  contents: read

# A newer commit on the same branch supersedes an in-flight run, except on main
# where every merged commit deserves its own recorded result.
concurrency:
  group: cwf-ci-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          # The whitespace/conflict-marker gate compares the exact base and head
          # SHAs. A shallow checkout does not contain both sides of that diff.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the runtime the app is developed and deployed against.
          node-version: '22'
          cache: npm

      - name: Install exactly the pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check every shipped script
        # Catches a broken file even if no test happens to require it.
        run: |
          set -e
          FAILED=0
          for file in $(git ls-files '*.js' | grep -v '^node_modules/'); do
            node --check "$file" || { echo "::error file=$file::syntax error"; FAILED=1; }
          done
          exit $FAILED

      - name: Reject stray conflict markers and trailing whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          else
            git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"
          fi

      - name: Run the test suite
        # Database-backed suites self-skip when no isolated Postgres URL is set,
        # exactly as they do locally. They are never pointed at a real database.
        run: npm test

      - name: Identify failing test files
        if: failure()
        shell: bash
        run: |
          set +e
          FAILED=0
          DIAG=/tmp/cwf-failing-tests.log
          : > "$DIAG"
          for file in test/*.test.js; do
            node --test "$file" >/tmp/cwf-test-file.log 2>&1
            STATUS=$?
            if [ "$STATUS" -ne 0 ]; then
              echo "::error file=$file::isolated test file failed"
              echo "===== $file ====="
              tail -n 200 /tmp/cwf-test-file.log
              {
                echo "===== $file ====="
                tail -n 200 /tmp/cwf-test-file.log
                echo
              } >> "$DIAG"
              FAILED=1
            fi
          done
          exit "$FAILED"

      - name: Upload failing test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cwf-failing-tests
          path: /tmp/cwf-failing-tests.log
          if-no-files-found: warn
          retention-days: 1

  # The job above never starts a database, so every database-backed assertion in
  # the suite self-skips there. That left the AIR CARE prepaid lifecycle — the
  # part that lives in PostgreSQL triggers rather than in JavaScript — with no
  # automated gate at all: whether a paid Order's location reaches the Job, whether
  # a prepaid Job settles at zero, and whether cancelling a Job gives the paid
  # right back were only ever checked by hand against Staging.
  #
  # This job runs those assertions against a throwaway PostgreSQL container using
  # the exact migration that ships to Staging and Production. It is deliberately
  # scoped to that one suite so it stays fast and so a pre-existing fixture gap in
  # an unrelated database suite cannot block an AIR CARE release.
  database:
    name: npm test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # The database-backed suites default to "cwf_test" when nothing in the
          # environment names one, so creating it here is what lets this job run
          # without the workflow carrying any connection settings of its own.
          POSTGRES_DB: cwf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly the pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the whole suite against a disposable PostgreSQL
        # No connection environment is set on purpose. The suites' built-in
        # defaults (127.0.0.1:5432, user and password postgres, database
        # cwf_test) already describe the ephemeral service container above, so
        # this workflow still holds no database credentials and still cannot
        # address a real host.
        #
        # The TAP reporter is pinned because the next step greps its summary;
        # the default reporter's output format is not a stable contract.
        run: |
          set -euo pipefail
          node --test --test-reporter=tap test/*.test.js | tee /tmp/cwf-db-suite.log

      - name: Fail if the prepaid lifecycle silently skipped
        # The run above is green whether a database-backed case asserted or
        # skipped itself, and a skip here would mean the AIR CARE lifecycle was
        # never exercised at all — a green light proving nothing. A database is
        # guaranteed in this job, so treat that specific suite skipping as a
        # failure. The remaining expected skips are the two opt-in suites that
        # want their own CWF_ISSUE*_TEST_DATABASE_URL, which this workflow must
        # not carry: naming one would break the Issue 320 isolation contract
        # asserted in test/repositoryShippableArtifacts.test.js.
        run: |
          set -euo pipefail
          grep -E '^# (tests|pass|fail|skipped)' /tmp/cwf-db-suite.log
          node --test --test-reporter=tap test/prepaidLifecycleDatabase.test.js \
            | tee /tmp/cwf-prepaid-lifecycle.log
          if grep -qE '^# skipped [1-9]' /tmp/cwf-prepaid-lifecycle.log; then
            echo "::error::prepaid lifecycle suite skipped despite an available database"
            exit 1
          fi
          if ! grep -qE '^# pass [1-9]' /tmp/cwf-prepaid-lifecycle.log; then
            echo "::error::prepaid lifecycle suite asserted nothing"
            exit 1
          fi
